name: Build and Push Docker Image + Helm Chart

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push Helm chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          # On a version tag (v1.2.3), publish the chart as-is from Chart.yaml.
          # On a plain main push, append +<sha> so every commit produces a
          # distinct, traceable chart version without requiring a manual bump.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            helm package charts/texas-fold-em
          else
            SHA=$(echo "${{ github.sha }}" | head -c 7)
            BASE_VER=$(grep '^version:' charts/texas-fold-em/Chart.yaml | awk '{print $2}')
            helm package charts/texas-fold-em --version "${BASE_VER}+${SHA}"
          fi
          helm push texas-fold-em-*.tgz oci://ghcr.io/rounakdatta/charts
