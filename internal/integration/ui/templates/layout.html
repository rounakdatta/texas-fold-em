{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
  <title>{{.Title}} · fold</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b6cff'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{asset "app.css"}}">
  {{block "head" .}}{{end}}
</head>
<body class="{{block "bodyclass" .}}{{end}}">
  <header class="appbar">
    <a class="brand" href="/admin/ui/review" aria-label="fold — review">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-name">fold</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/admin/ui/review"{{if eq .Nav "review"}} aria-current="page"{{end}}>Review{{if .ReviewCount}} <span class="count num">{{.ReviewCount}}</span>{{end}}</a>
      <a href="/admin/ui/?status=all"{{if eq .Nav "list"}} aria-current="page"{{end}}>Transactions</a>
      <a href="/admin/ui/new"{{if eq .Nav "new"}} aria-current="page"{{end}}>Add</a>
    </nav>
  </header>
  {{block "main" .}}
  <main class="page">
    {{if .Flash}}<div class="flash flash-{{.Flash.Kind}}" role="status">{{.Flash.Message}}</div>{{end}}
    {{block "content" .}}{{end}}
  </main>
  {{end}}
  <script src="{{asset "app.js"}}" defer></script>
</body>
</html>
{{end}}
