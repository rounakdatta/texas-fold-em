apiVersion: v1
kind: Service
metadata:
  name: {{ include "texas-fold-em.fullname" . }}
  labels:
    {{- include "texas-fold-em.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "texas-fold-em.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
