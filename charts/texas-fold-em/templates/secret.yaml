{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "texas-fold-em.fullname" . }}
  labels:
    {{- include "texas-fold-em.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.secret.brokerKeyRef }}: {{ required "secret.brokerKey is required when secret.create=true (or set secret.existingSecret to bring your own)" .Values.secret.brokerKey | quote }}
  {{ .Values.secret.adminKeyRef }}:  {{ required "secret.adminKey is required when secret.create=true (or set secret.existingSecret to bring your own)"  .Values.secret.adminKey  | quote }}
{{- end }}
