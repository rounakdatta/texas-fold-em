apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "texas-fold-em.fullname" . }}
  labels:
    {{- include "texas-fold-em.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "texas-fold-em.fullname" . }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "texas-fold-em.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "texas-fold-em.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: broker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TEXAS_FOLDEM_LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: TEXAS_FOLDEM_STATE_PATH
              value: "/state/state.json"
            - name: TEXAS_FOLDEM_REFRESH_LEAD
              value: {{ .Values.env.refreshLead | quote }}
            - name: TEXAS_FOLDEM_KEEPWARM_EVERY
              value: {{ .Values.env.keepwarmEvery | quote }}
            - name: TEXAS_FOLDEM_HTTP_TIMEOUT
              value: {{ .Values.env.httpTimeout | quote }}
            - name: TEXAS_FOLDEM_SHUTDOWN_GRACE
              value: {{ .Values.env.shutdownGrace | quote }}
            - name: TEXAS_FOLDEM_LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: TEXAS_FOLDEM_BROKER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "texas-fold-em.secretName" . }}
                  key: {{ .Values.secret.brokerKeyRef }}
            - name: TEXAS_FOLDEM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "texas-fold-em.secretName" . }}
                  key: {{ .Values.secret.adminKeyRef }}
          # Both probes hit /livez (always 200 while HTTP is up). Readiness
          # must NOT gate on seeded-ness — if it did, the Service wouldn't
          # route /init traffic and bootstrap would be impossible.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 2
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /state
  volumeClaimTemplates:
    - metadata:
        name: state
        labels:
          {{- include "texas-fold-em.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
