image:
  repository: ghcr.io/rounakdatta/texas-fold-em
  tag: latest
  pullPolicy: IfNotPresent

# Single writer by design — do not scale beyond 1
replicaCount: 1

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce

# Bearer keys. Either supply inline (secret.create: true) or bring your
# own Secret (secret.create: false, secret.existingSecret: <name>).
secret:
  create: true
  brokerKey: ""
  adminKey: ""
  existingSecret: ""

env:
  TEXAS_FOLDEM_REFRESH_LEAD: 2m
  TEXAS_FOLDEM_KEEPWARM_EVERY: 30s
  TEXAS_FOLDEM_HTTP_TIMEOUT: 15s
  TEXAS_FOLDEM_SHUTDOWN_GRACE: 10s
  TEXAS_FOLDEM_LOG_LEVEL: info

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
